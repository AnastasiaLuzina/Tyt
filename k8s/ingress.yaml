apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tyt-ingress
spec:
  rules:
    - host: tyt.example.com   # заменить на реальный домен
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tyt-service
                port:
                  number: 80